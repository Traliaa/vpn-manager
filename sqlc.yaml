version: "2"
sql:
  - engine: "postgresql"
    schema: "migrations/"
    queries: "internal/db/queries/"
    gen:
      go:
        package: "db"
        out: "internal/db"
        sql_package: "pgx/v5"
        emit_json_tags: true
        emit_prepared_queries: false
        emit_interface: true
        emit_empty_slices: true
        json_tags_case_style: "snake"
        overrides:
          - db_type: "jsonb"
            go_type: "string"
          - db_type: "json"
            go_type: "string"
