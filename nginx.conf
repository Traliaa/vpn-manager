server {
    listen 80;
    server_name vpn-manager.etk3.xyz;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files (Svelte SPA)
    root /usr/share/nginx/html;
    index index.html;

    # index.html не кешируем — должен всегда свежим приходить
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Ассеты с хешем в имени — кешируются навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — app на host network, доступен через localhost
    location /api/ {
        proxy_pass http://127.0.0.1:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Мониторинг (Uptime Kuma) — порт 3001 проброшен на хост
    location /monitoring/ {
        rewrite ^/monitoring/(.*) /$1 break;
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Всё остальное — index.html для SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
