upstream vpn-api {
    server app:8080;
}

# HTTP → HTTPS redirect
server {
    listen 80;
    server_name vpn-manager.etk3.xyz;
    return 301 https://$host$request_uri;
}

# HTTPS
server {
    listen 443 ssl;
    server_name vpn-manager.etk3.xyz;

    # SSL
    ssl_certificate /etc/letsencrypt/live/vpn-manager.etk3.xyz/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/vpn-manager.etk3.xyz/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;

    # Static files (Svelte SPA)
    root /usr/share/nginx/html;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Service worker / app manifest — no cache
    location ~* (service-worker\.js|sw\.js|manifest\.json) {
        add_header Cache-Control "no-cache";
    }

    # API proxy
    location /api/ {
        proxy_pass http://vpn-api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
