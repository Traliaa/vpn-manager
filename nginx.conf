resolver 127.0.0.11 valid=30s ipv6=off;

server {
    listen 80;
    server_name vpn-manager.etk3.xyz;

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;

    # Static files (Svelte SPA)
    root /usr/share/nginx/html;
    index index.html;

    # index.html не кешируем — должен всегда свежим приходить
    location = /index.html {
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # Ассеты с хешем в имени — кешируются навсегда
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # API proxy — динамический DNS через переменную
    location /api/ {
        set $backend "http://app:8080";
        proxy_pass $backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 30s;
    }

    # Мониторинг (Uptime Kuma) — прокси без порта
    location /monitoring/ {
        set $monitor "http://uptime-kuma:3001";
        proxy_pass $monitor;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # Всё остальное — index.html для SPA
    location / {
        try_files $uri $uri/ /index.html;
    }
}
