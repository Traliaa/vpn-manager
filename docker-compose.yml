services:
  postgres:
    image: postgres:16-alpine
    container_name: vpn-manager-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: vpnmanager
      POSTGRES_PASSWORD: vpnmanager
      POSTGRES_DB: vpnmanager
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vpnmanager -d vpnmanager"]
      interval: 5s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: vpn-manager
    restart: unless-stopped
    environment:
      SERVER_HOST: "0.0.0.0"
      SERVER_PORT: "8080"
      DATABASE_DSN: "postgres://vpnmanager:vpnmanager@127.0.0.1:5432/vpnmanager?sslmode=disable"
      MIGRATIONS_DIR: "/migrations"
      LOG_LEVEL: "debug"
      VPN_BIN_DIR: "/usr/local/bin"
      SINGBOX_CONFIG_PATH: "/etc/sing-box/config.json"
      SINGBOX_BINARY_PATH: "sing-box"
      SINGBOX_API_URL: "http://127.0.0.1:9090"
      SINGBOX_API_ENABLED: "false"
    depends_on:
      postgres:
        condition: service_healthy
    cap_add:
      - NET_ADMIN
      - NET_RAW
      - SYS_MODULE
    privileged: true
    network_mode: "host"
    volumes:
      - /etc/localtime:/etc/localtime:ro

  nginx:
    build:
      context: .
      dockerfile: docker/nginx.Dockerfile
    container_name: vpn-manager-nginx
    restart: unless-stopped
    network_mode: "host"
    volumes:
      - /etc/localtime:/etc/localtime:ro
    depends_on:
      app:
        condition: service_started

  uptime-kuma:
    image: louislam/uptime-kuma:latest
    container_name: vpn-manager-uptime
    restart: unless-stopped
    ports:
      - "3001:3001"
    volumes:
      - uptime-kuma-data:/app/data

volumes:
  pgdata:
  uptime-kuma-data:
